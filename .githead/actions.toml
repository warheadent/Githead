[[actions]]
name = "Packaging > Package for Windows"
description = "Build an unpacked Windows application bundle for local testing."
command = "npm run package:win:dir"
shell = "powershell"

[[actions]]
name = "Packaging > Package and Launch for Windows"
description = "Build the unpacked Windows application and launch it when packaging succeeds."
command = "npm run package:win:dir; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; Start-Process -FilePath '.\\release\\win-unpacked\\Githead.exe'"
shell = "powershell"
bind_to_pull = true

[[actions]]
name = "Typecheck"
description = "Check the renderer, Electron, and test TypeScript projects without emitting files."
command = "npm run typecheck"
shell = "powershell"

[[actions]]
name = "Test"
description = "Runs the repository test command"
command = "npm test"
shell = "powershell"
